<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vscode-icons/code.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fregat</title>
    <!-- boot-appearance -->
    <script>
      // Pre-paint theme class and palette for the boot floor above. Reads the
      // settings boot mirror (written by features/settings/utils/boot-mirror.ts,
      // which this classic script cannot import — a module script would defer
      // past first paint). applyAppearance in main.tsx re-applies the full
      // appearance once the app boots; this only decides dark vs light,
      // palette, and density.
      ;(() => {
        let theme = 'system'
        let palette = 'graphite'
        let paletteCss = null
        let density = 'compact'
        let wallpaper = { enabled: true, source: { kind: 'desktop' } }
        let fontId = 'JetBrainsMono'
        try {
          const raw = localStorage.getItem('platform.settings-boot-mirror.v1')
          const mirror = raw ? JSON.parse(raw) : {}
          const storedTheme = mirror['workbench.colorTheme']
          const storedDensity = mirror['workbench.density']
          if (storedTheme === 'dark' || storedTheme === 'light') theme = storedTheme
          if (typeof mirror['editor.fontFamily'] === 'string') fontId = mirror['editor.fontFamily']
          if (typeof mirror['workbench.palette'] === 'string') palette = mirror['workbench.palette']
          let mode = theme
          if (mode === 'system')
            mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const bundle = mirror['workbench.theme']
          const variant = bundle?.variants?.[mode]
          const custom = mirror['workbench.theme.customizations']?.[bundle?.id]?.[mode]
          if (variant) {
            palette = custom?.palette ?? variant.palette
            wallpaper = custom?.wallpaper ?? variant.wallpaper
          }
          // Written by lib/appearance/utils/palette-style.ts for the confirmed
          // selection; a cache for another palette is simply not this one.
          const cache = JSON.parse(localStorage.getItem('platform.palette-boot.v1') ?? 'null')
          if (
            cache &&
            Array.isArray(cache.ids) &&
            cache.ids.includes(palette) &&
            typeof cache.css === 'string'
          )
            paletteCss = cache.css
          if (storedDensity === 'compact' || storedDensity === 'cozy') density = storedDensity
          if (!variant && mirror['workbench.wallpaper']) wallpaper = mirror['workbench.wallpaper']
        } catch {
          // An unreadable mirror costs a system-theme boot floor, nothing more.
        }
        const dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const root = document.documentElement
        root.classList.add(dark ? 'dark' : 'light')
        root.setAttribute('data-density', density)
        const source = wallpaper.enabled ? wallpaper.source : null
        if (!wallpaper.enabled) root.setAttribute('data-wallpaper-hidden', '')
        preloadWallpaper(source?.kind === 'desktop')
        startEditorFont(fontId)
        if (paletteCss === null) return

        // Before globals.css loads, so the first frame already carries the
        // selected palette instead of flashing Graphite.
        const style = document.createElement('style')
        style.id = 'platform-palette'
        style.textContent = paletteCss
        document.head.append(style)
      })()

      // Mirrors defaultServerUrl in src/lib/client.ts: an explicit development
      // override, else the page's own base URL, which is where one server serves both.
      function serverBase() {
        const configuredServer = '%VITE_SERVER_URL%'
        const developmentServer = '%DEV%' === 'true' ? 'http://localhost:3001' : '%BASE_URL%'
        const server = new URL(
          configuredServer.startsWith('%') ? developmentServer : configuredServer,
          location.href,
        )
        return `${server.origin}${server.pathname.replace(/\/+$/, '')}`
      }

      // The editor measures its cell width as it mounts, so the face has to be in flight before
      // the bundle is. Family and URL mirror src/lib/default-nerd-font.ts, which adopts this face.
      function startEditorFont(fontId) {
        if (typeof FontFace === 'undefined') return
        const url = `${serverBase()}/fonts/${encodeURIComponent(fontId)}`
        const face = new FontFace(`${fontId} Nerd Font`, `url(${JSON.stringify(url)})`, {
          display: 'swap',
          style: 'normal',
          weight: '400',
        })
        document.fonts.add(face)
        // A family the user typed is not on the server; the stack falls through to the local one.
        face.load().catch(() => {})
      }

      function preloadWallpaper(enabled) {
        if (!enabled) return
        const backdrop = window.platformBridge?.backdrop
        if (backdrop === 'transparent' || backdrop === 'compositor') return
        const platform = navigator.userAgentData?.platform
        const desktopLinux = platform
          ? platform === 'Linux'
          : !/android/i.test(navigator.userAgent) && /linux|bsd/i.test(navigator.userAgent)
        if (desktopLinux) return

        const desktopStill = `${serverBase()}/wallpaper/still`
        const preload = document.createElement('link')
        preload.rel = 'preload'
        preload.as = 'image'
        preload.crossOrigin = 'anonymous'
        preload.href = desktopStill
        preload.fetchPriority = 'high'
        preload.dataset.workbenchWallpaperPreload = 'pending'
        preload.onload = () => {
          preload.dataset.workbenchWallpaperPreload = 'ready'
        }
        preload.onerror = () => {
          preload.dataset.workbenchWallpaperPreload = 'error'
        }
        document.head.append(preload)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
