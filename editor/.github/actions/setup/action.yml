name: Setup
description: Installs Bun, Node and dependencies, and restores this job's turbo cache.

runs:
  using: composite
  steps:
    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@v2

    # `bun run test` runs each package's `vitest run`, and vitest's bin is a Node script — so the
    # tests execute on Node, not on Bun, and the runner's default Node is older than this repo
    # assumes. `packages/find` uses RegExp modifier groups (`(?s:a.b)`), which V8 only gained
    # recently, so without this the suite fails on a feature the code legitimately relies on.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # Turbo replays a task whose inputs are unchanged, so a PR re-runs only what its change can
    # reach. Each job saves its own cache, keyed by commit; a restore falls back to this job's
    # newest cache, then any job's (builds are shared), on this branch and then on main.
    # `scripts/check-turbo-inputs.mjs` fails CI when a package reads a file its task's hash does not cover.
    - name: Restore turbo cache
      uses: actions/cache@v6
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-node-24-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-node-24-${{ github.job }}-
          turbo-${{ runner.os }}-bun-${{ steps.bun.outputs.bun-version }}-node-24-
