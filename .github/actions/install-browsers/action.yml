name: Install browsers
description: Installs workspace Playwright browsers with shared browser payloads and Ubuntu dependency archives.

inputs:
  playwright:
    description: Workspace Playwright executable.
    required: true
  browsers:
    description: Space-separated Playwright browser names.
    required: true

runs:
  using: composite
  steps:
    - name: Verify Ubuntu package source setup
      shell: bash
      run: bun --bun vitest run "$GITHUB_ACTION_PATH/action.test.ts" --environment node

    - name: Resolve Playwright payload cache
      id: payloads
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        read -r -a browsers <<< "$BROWSERS"
        test "${#browsers[@]}" -gt 0
        plan=$("$PLAYWRIGHT" install --dry-run) || exit "$?"
        requested=$("$PLAYWRIGHT" install --dry-run "${browsers[@]}") || exit "$?"
        locations=$(printf '%s\n' "$requested" | sed -n 's/^  Install location: *//p') || exit "$?"
        test -n "$locations" || exit 1
        cache=$(while IFS= read -r location; do dirname "$location" || exit "$?"; done <<< "$locations" | sort -u) || exit "$?"
        test -n "$cache" || exit 1
        count=$(printf '%s\n' "$cache" | wc -l) || exit "$?"
        test "$count" -eq 1 || exit 1
        # Download URLs include platform-specific revisions; locations vary by runner home.
        fingerprint() {
          local downloads directories digest
          downloads=$(printf '%s\n' "$1" | sed -n 's/^  Download url: *//p' | sort -u) || return "$?"
          directories=$(printf '%s\n' "$1" | sed -n 's|^  Install location: .*/||p' | sort -u) || return "$?"
          test -n "$downloads" || return 1
          test -n "$directories" || return 1
          digest=$(printf '%s\n' "$downloads" "$directories" | sha256sum | cut -d ' ' -f 1) || return "$?"
          test -n "$digest" || return 1
          echo "$digest"
        }
        revision=$(fingerprint "$plan") || exit "$?"
        selection=$(fingerprint "$requested") || exit "$?"
        prefix="playwright-payloads-v1-${RUNNER_OS}-${RUNNER_ARCH}-${revision}-"
        echo "path=$cache" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$selection" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright payloads
      id: payload-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.payloads.outputs.path }}
        key: ${{ steps.payloads.outputs.key }}
        restore-keys: ${{ steps.payloads.outputs.prefix }}

    - name: Configure Ubuntu package downloads
      id: apt
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
        archives="/tmp/playwright-apt"
        install -d -m 0755 "$archives"
        sudo install -d -o _apt -g root -m 0700 "$archives/partial"
        sudo -u _apt test -w "$archives/partial"
        sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null <<EOF
        Dir::Cache::archives "$archives";
        APT::Keep-Downloaded-Packages "true";
        Binary::apt-get::APT::Keep-Downloaded-Packages "true";
        EOF
        version="$("$PLAYWRIGHT" --version | awk '{print $2}')"
        browsers="$(printf '%s' "$BROWSERS" | sha256sum | cut -d ' ' -f 1)"
        echo "key=browser-apt-v3-${ImageOS}-${ImageVersion}-${RUNNER_ARCH}-${version}-${browsers}" >> "$GITHUB_OUTPUT"

    - name: Restore Ubuntu dependency archives
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: /tmp/playwright-apt/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Install Playwright browsers and dependencies
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        read -r -a browsers <<< "$BROWSERS"
        "$PLAYWRIGHT" install --with-deps "${browsers[@]}"

    - name: Save Ubuntu dependency archives
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: /tmp/playwright-apt/*.deb
        key: ${{ steps.apt.outputs.key }}

    - name: Save Playwright payloads
      if: ${{ steps.payload-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.payloads.outputs.path }}
        key: ${{ steps.payloads.outputs.key }}
