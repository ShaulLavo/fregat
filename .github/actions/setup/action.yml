name: Setup
description: Installs the toolchain and workspace dependencies, then builds Editor and ghostty packages.

runs:
  using: composite
  steps:
    # Pinned from `packageManager` in package.json so CI and the pre-commit
    # hook cannot disagree about which Bun compiled the code.
    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # The node-pty bridge spawns the real Node binary, never Bun's `node`
    # shim, so the terminal tests need a genuine Node on PATH.
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # Workspace search shells out to `fd` and `rg`, and silently degrades to a
    # different provider when either is missing — so without these the search
    # tests do not fail loudly, they assert against the fallback's results.
    # The action hash keys the pinned versions and checksums together.
    - name: Restore search tool archives
      id: search-tools-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/search-tools
        key: search-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup/action.yml') }}

    # Pinned release binaries: `apt-get update` alone took ~10 s per job.
    - name: Install search tools
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RG_VERSION: 15.2.0
        RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        FD_VERSION: 10.4.2
        FD_SHA256: e3257d48e29a6be965187dbd24ce9af564e0fe67b3e73c9bdcd180f4ec11bdde
      run: |
        mkdir -p "$RUNNER_TEMP/search-tools" "$RUNNER_TEMP/search-tool-bin"
        cd "$RUNNER_TEMP/search-tools"
        rg="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
        fd="fd-v$FD_VERSION-x86_64-unknown-linux-musl"
        download() {
          local repo="$1" tag="$2" archive="$3" attempt delay
          if [[ -f "$archive" ]]; then return; fi
          for attempt in 1 2 3 4 5 6; do
            echo "Downloading $repo $tag $archive (attempt $attempt/6)"
            if timeout 30s gh release download "$tag" --repo "$repo" --pattern "$archive" --dir . --clobber; then
              return
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "::error::Failed to download $repo $tag $archive after 6 attempts"
              return 1
            fi
            delay=$((2 ** attempt))
            echo "Retrying $repo in ${delay}s"
            sleep "$delay"
          done
        }
        download BurntSushi/ripgrep "$RG_VERSION" "$rg.tar.gz"
        download sharkdp/fd "v$FD_VERSION" "$fd.tar.gz"
        printf '%s  %s\n' "$RG_SHA256" "$rg.tar.gz" "$FD_SHA256" "$fd.tar.gz" | sha256sum --check --strict
        tar -xzf "$rg.tar.gz" -C "$RUNNER_TEMP/search-tool-bin" "$rg/rg"
        tar -xzf "$fd.tar.gz" -C "$RUNNER_TEMP/search-tool-bin" "$fd/fd"
        sudo install -m 0755 "$RUNNER_TEMP/search-tool-bin/$rg/rg" "$RUNNER_TEMP/search-tool-bin/$fd/fd" /usr/local/bin/

    # Save after verification, even when a later dependency or test step fails.
    - name: Save search tool archives
      if: steps.search-tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/search-tools
        key: ${{ steps.search-tools-cache.outputs.cache-primary-key }}

    # The git service tests build real repositories and commit to them, which
    # needs an identity the runner does not have.
    - name: Configure git identity
      shell: bash
      run: |
        git config --global user.email 'ci@example.com'
        git config --global user.name 'CI'

    - name: Install dependencies
      shell: bash
      run: |
        # Exported preparation requires committed manifests/configuration and complete tracked content.
        git diff --quiet HEAD -- .
        metadata=$(git ls-files --others --exclude=node_modules -- ':(glob)**/package.json' ':(glob)**/bunfig.toml' ':(glob)**/.npmrc' package.json bun.lock bunfig.toml .npmrc .env .env.local .env.development .env.test .env.production .env.development.local .env.test.local .env.production.local)
        if [[ -n "$metadata" ]]; then
          echo "::error::Dependency preparation requires tracked manifests and configuration"
          exit 1
        fi
        git ls-files --stage | awk '$1 == "160000" { exit 1 }'
        cache=$(bun pm cache)
        prep=$(mktemp -d "$RUNNER_TEMP/bun-prepare.XXXXXX")
        trap 'rm -rf "$prep"' EXIT
        log=$(mktemp "$RUNNER_TEMP/bun-install.XXXXXX")
        trap 'rm -f "$log"; rm -rf "$prep"' EXIT
        if git archive HEAD | tar -x -C "$prep"; then
          :
        else
          statuses=("${PIPESTATUS[@]}")
          if [[ "${statuses[0]}" != 0 ]]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
        fi
        for attempt in 1 2 3 4 5 6; do
          if (cd "$prep" && bun install --frozen-lockfile --ignore-scripts --cache-dir "$cache") 2>&1 | tee "$log"; then
            break
          else
            statuses=("${PIPESTATUS[@]}")
          fi
          if [[ "${statuses[1]}" != 0 ]]; then exit "${statuses[1]}"; fi
          status="${statuses[0]}"
          # Fail closed when any diagnostic falls outside the observed download failure.
          if ! awk '
            /^error: failed to download [^[:space:]]+@https:\/\/github\.com\/[^/[:space:]]+\/[^/[:space:]]+\/releases\/download\/[^[:space:]]+\.tgz: HTTP 5xx$/ { errors++; next }
            /^error: GET https:\/\/github\.com\/[^/[:space:]]+\/[^/[:space:]]+\/releases\/download\/[^[:space:]]+\.tgz - 5[0-9][0-9]$/ { errors++; next }
            /^$/ || /^bun install v[0-9]/ || /^Resolving dependencies$/ { next }
            /^Resolved, downloaded and extracted \[[0-9]+\]$/ { next }
            /^  https:\/\/github\.com\/[^/[:space:]]+\/[^/[:space:]]+\/releases\/download\/[^[:space:]]+\.tgz$/ { next }
            /^\+ [^[:space:]]+$/ || /^[0-9]+ packages? installed \[[0-9.]+(ms|s)\]$/ { next }
            /^Failed to install [0-9]+ packages?$/ { next }
            { other++ }
            END { exit !(errors > 0 && other == 0) }
          ' "$log" || [[ "$attempt" == 6 ]] || (( status >= 128 )); then
            exit "$status"
          fi
          delay=$((2 ** attempt))
          echo "::warning::GitHub dependency download failed; retrying dependency preparation in ${delay}s (attempt $((attempt + 1))/6)"
          sleep "$delay"
        done
        bun install --frozen-lockfile

    - name: Build workspace packages
      shell: bash
      run: bun run build:workspaces
