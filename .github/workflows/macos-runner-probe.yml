name: Case scope diagnostic (throwaway)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: all
      - name: Narrow
        run: |
          for i in 1 2 3; do bun --bun vitest run --config vitest.scripts.config.mjs scripts/large-file/case-scope.test.ts 2>&1 | grep -E 'CASE-SCOPE-DIAG|✓|×|FAIL|Tests' || true; done
      - name: Full scripts suite
        run: bun run test:scripts --exclude scripts/markdown/promotion-evidence.test.ts 2>&1 | grep -E 'CASE-SCOPE-DIAG|case-scope|FAIL|Tests |Test Files' || true
      - name: Evidence
        if: always()
        run: |
          for f in /tmp/scope-trace/*; do echo "##### $f"; cat "$f"; done
          sudo dmesg | grep -iE 'oom|killed process|memory cgroup' | tail -80
          journalctl --user --no-pager | grep -E 'large-file-scope' | tail -80
