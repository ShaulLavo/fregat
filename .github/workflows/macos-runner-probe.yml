name: Case scope diagnostic (throwaway)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun 1.4.2 and 1.4.4
        run: |
          for v in 1.4.2 1.4.4; do
            curl -fsSL https://bun.sh/install | BUN_INSTALL="$HOME/bun-$v" bash -s "bun-v$v" >/dev/null
          done
      - name: Diagnose
        run: .github/case-scope-diag/diag.sh 2>&1
