name: Collaborative text stress

on:
  pull_request:
    paths:
      - 'editor/packages/collab/**'
      - 'editor/packages/textbuffer/**'
      - 'editor/scripts/build-package.ts'
      - 'bun.lock'
      - '.github/workflows/editor-collab.yml'
  push:
    branches: ['main']
    paths:
      - 'editor/packages/collab/**'
      - 'editor/packages/textbuffer/**'
      - 'bun.lock'
      - '.github/workflows/editor-collab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collab-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build identity storage and collaboration
        run: |
          bun run --cwd editor/packages/textbuffer build
          bun run --cwd editor/packages/collab build
      - name: Check types, lint and formatting
        run: |
          bun run --cwd editor/packages/collab typecheck
          bun run --cwd editor/packages/collab lint
          bun run --cwd editor/packages/collab format:check
      - name: Verify both engines, differential replay and independent visibility
        env:
          COLLAB_STRESS: '1'
        run: bun run --cwd editor/packages/collab test
