name: Package releases

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Create version PR or publish packages
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run changeset version && bun install --lockfile-only
          publish-script: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && 'bun run release' || '' }}
          pr-title: Version public packages
          commit-message: Version public packages
