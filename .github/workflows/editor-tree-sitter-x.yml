name: tree-sitter-x

# Generate with read access, then publish the generated data to one rolling pull request.
# Updates stay open for manual review and merging.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tree-sitter-x-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Pin the newest build
        run: bun run --cwd packages/singapore tree-sitter-x:update
      - name: Save the generated change
        run: |
          mkdir "$RUNNER_TEMP/pin-update"
          git diff --binary > "$RUNNER_TEMP/pin-update/update.patch"
          base=$(git rev-parse HEAD)
          runtime=$(jq -r '.dependencies["web-tree-sitter"] | split("#")[1]' packages/singapore/packages/tree-sitter/package.json)
          markdown=$(jq -r '.dependencies["tree-sitter-md"] | split("#")[1]' packages/singapore/packages/tree-sitter/package.json)
          jq -n --arg base "$base" --arg runtime "$runtime" --arg markdown "$markdown" \
            '{base: $base, runtime: $runtime, markdown: $markdown}' > "$RUNNER_TEMP/pin-update/metadata.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parser-pin-change
          path: ${{ runner.temp }}/pin-update
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Only trusted main code runs here. The generated patch is data, never executed.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          name: parser-pin-change
          path: pin-update
      - name: Open a pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/parser-pins.mjs publish
      # GITHUB_TOKEN PRs do not start PR CI. Manual CI validates the entire repository.
      - name: Dispatch full CI
        if: ${{ steps.publish.outputs.head != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          branch: ${{ steps.publish.outputs.branch }}
          commit: ${{ steps.publish.outputs.head }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" --jq '.object.sha')
          if [ "$tip" != "$commit" ]; then
            echo "::error::Pin branch moved before CI dispatch" >&2
            exit 1
          fi
          run=$(gh run list --workflow ci.yml --branch "$branch" --commit "$commit" --event workflow_dispatch --limit 20 --json status,conclusion,headSha,headBranch,event |
            jq -c --arg branch "$branch" --arg commit "$commit" '[.[] | select(.event == "workflow_dispatch" and .headBranch == $branch and .headSha == $commit)] | first // empty')
          if [ -z "$run" ] || jq -e '.status == "completed" and .conclusion != "success"' <<<"$run" > /dev/null; then
            gh workflow run ci.yml --ref "$branch"
            dispatched_tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" --jq '.object.sha')
            if [ "$dispatched_tip" != "$commit" ]; then
              echo "::error::Pin branch moved during CI dispatch" >&2
              exit 1
            fi
          fi
