name: tree-sitter-x

# Generate with read access, publish data with write access, then merge only the exact head
# recorded by this updater after its explicitly dispatched full CI verdict succeeds.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tree-sitter-x-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Pin the newest build
        run: bun run --cwd editor tree-sitter-x:update
      - name: Save the generated change
        run: |
          mkdir "$RUNNER_TEMP/pin-update"
          git diff --binary > "$RUNNER_TEMP/pin-update/update.patch"
          base=$(git rev-parse HEAD)
          runtime=$(jq -r '.dependencies["web-tree-sitter"] | split("#")[1]' editor/packages/tree-sitter/package.json)
          markdown=$(jq -r '.dependencies["tree-sitter-md"] | split("#")[1]' editor/packages/tree-sitter/package.json)
          jq -n --arg base "$base" --arg runtime "$runtime" --arg markdown "$markdown" \
            '{base: $base, runtime: $runtime, markdown: $markdown}' > "$RUNNER_TEMP/pin-update/metadata.json"
      - uses: actions/upload-artifact@v4
        with:
          name: parser-pin-change
          path: ${{ runner.temp }}/pin-update
          retention-days: 1

  publish:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # Only trusted main code runs here. The generated patch is data, never executed.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          name: parser-pin-change
          path: pin-update
      - name: Open a pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/parser-pins.mjs publish
      - name: Record the generated head
        if: ${{ steps.publish.outputs.head != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-pin-${{ steps.publish.outputs.head }}
          overwrite: true
          path: pin-receipt.json
          retention-days: 30
      # GITHUB_TOKEN PRs do not start PR CI. Manual CI validates the entire repository.
      - name: Dispatch full CI
        if: ${{ steps.publish.outputs.head != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          branch: ${{ steps.publish.outputs.branch }}
          commit: ${{ steps.publish.outputs.head }}
        run: |
          runs=$(gh run list --workflow ci.yml --branch "$branch" --commit "$commit" --event workflow_dispatch --limit 1 --json databaseId -q length)
          if [ "$runs" -eq 0 ]; then
            gh workflow run ci.yml --ref "$branch"
          fi
