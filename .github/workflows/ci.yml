name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to a PR branch makes the first run's answer worthless. On main every
# run finishes, so main always has a verdict; pushes during a run collapse into one
# pending run of the newest commit, because GitHub keeps one pending run per group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A PR runs only the jobs its files can affect. `code` is anything outside plans and docs;
  # web and TUI tests drive the real server, so a server change runs them too. Main runs
  # everything: collapsed pending runs mean one run's diff is not everything since the last verdict.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
      tui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tui == 'true' }}
      docs: ${{ steps.filter.outputs.docs == 'true' }}
      docs_files: ${{ steps.filter.outputs.docs_files }}
    steps:
      - name: Classify changed files
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            code:
              - '**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            web:
              - '**'
              - '!apps/tui/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            server:
              - '**'
              - '!apps/web/**'
              - '!apps/tui/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            tui:
              - '**'
              - '!apps/web/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            docs:
              - added|modified: 'plans/**'
              - added|modified: 'docs/**'
              - added|modified: '*.md'

  # No workspace's `format:check` reaches plans and docs, so their changed files are checked here.
  docs:
    name: Docs format
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Format
        env:
          FILES: ${{ needs.changes.outputs.docs_files }}
        run: |
          version=$(jq -r '.devDependencies.oxfmt' package.json)
          jq -r '.[] | "./" + .' <<<"$FILES" | xargs -d '\n' bunx "oxfmt@$version" --check

  # Jobs instead of one runner doing everything in turn: each pays for setup once,
  # and no suite shares four cores with another.
  lint:
    name: Format, lint, census
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check

      # Workspaces lint in parallel (no dependency order to respect), and `apps/web`'s lint
      # already runs the root config's feature-boundary rules over all of `apps/web`.
      - name: Lint
        run: bun run lint

      - name: Query API
        run: bun run query:check

      - name: Design language census
        run: bun run design:census

      # Lint cannot stand in for this: its compiler rules miss components wrapped in `memo()`.
      - name: React Compiler census
        run: bun run compiler:census

      - name: Unused code
        run: bun run unused:check

  typecheck:
    name: Typecheck, generated
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate dev task graph
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: bun run dev:web -- --dry-run=json > /dev/null

      # Electrobun 2 ships its SDK as a Hutch devkit projected into
      # apps/desktop/.hutch, not through node_modules, so the desktop typecheck
      # and tests resolve nothing until it exists. Keyed on the pinned release;
      # the store is about 700 MB, so a cold prepare is a real download.
      - name: Cache Hutch store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('apps/desktop/package.json') }}

      - name: Prepare Electrobun devkit
        working-directory: apps/desktop
        run: node_modules/.bin/electrobun prepare

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated artifacts
        run: bun run generated:check

      # The one benchmark that survives a shared runner. Its thresholds are
      # ratios (remount speedup >= 0.2, cold slowdown <= 0.15), so runner speed
      # cancels out, and it is pure in-process: no browser, no server, no sibling
      # Editor checkout. ~4s, currently passing with ~4x margin. Every other
      # bench here gates on absolute milliseconds calibrated on one developer
      # machine, and `bench:editor-open:gate` cannot run in CI at all — its
      # calibration identity is a hash of `apps/web/src`, so any PR invalidates
      # it before a measurement happens.
      - name: Benchmark gate (file tree prepared input)
        run: bun run --cwd apps/web bench:file-tree-prepared-input:gate

      # Byte counts, not timings: a production build is deterministic, so this gate runs on a
      # shared runner. It builds itself and never reads a cached bundle-stats.json.
      - name: First-load gate
        run: bun run --cwd apps/web bundle:gate

  # Web is most of the time, so it is sharded by file. The `test` scripts in `apps/web` and
  # `packages/tree` are scoped to `--project node --project dom`; their browser projects are
  # the browser job.
  test-web:
    name: Test (web ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/web test --shard=${{ matrix.shard }}

  test-server:
    name: Test (server)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/server test

  test-tui:
    name: Test (tui)
    needs: changes
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/tui test

  # Package tests also read app sources (the session vocabulary scans `apps/web`), so they run
  # for any code change.
  test-packages:
    name: Test (packages)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Hutch store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('apps/desktop/package.json') }}

      - name: Prepare Electrobun devkit
        working-directory: apps/desktop
        run: node_modules/.bin/electrobun prepare

      - name: Test
        run: bun run test:scripts && bun run --filter '@workspace/*' test && bun run --cwd apps/desktop test

  browser:
    name: Browser tests
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # The workspace's own playwright binary, never `bunx playwright` — bunx
      # resolves a fresh copy from npm and downloads the browser revision *that*
      # version wants, leaving the pinned playwright pointing at a build that
      # was never fetched.
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      - name: Browser test (web)
        run: bun run --cwd apps/web test:browser

      - name: Browser test (tree)
        if: ${{ !cancelled() }}
        run: bun run --cwd packages/tree test:browser

  # The one status to read: red when any job failed or was cancelled; a job skipped because the
  # change cannot affect it counts as passed.
  verdict:
    name: CI
    needs: [changes, docs, lint, typecheck, test-web, test-server, test-tui, test-packages, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
