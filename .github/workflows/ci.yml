name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      web_shards:
        description: Web shard count for turnaround measurements.
        type: choice
        default: '4'
        options: ['2', '4']

# Each ref keeps one running and one pending run; newer pushes replace older pending runs.
# PRs also cancel their running run; main lets its running run finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # A PR runs only the jobs its files can affect. Main runs everything.
  # Web and TUI tests drive the real server, so a server change runs them too.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' || steps.filter.outputs.generated == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      server: ${{ github.event_name != 'pull_request' || steps.filter.outputs.server == 'true' }}
      tui: ${{ github.event_name != 'pull_request' || steps.filter.outputs.tui == 'true' }}
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      editor: ${{ github.event_name != 'pull_request' || steps.filter.outputs.editor == 'true' || steps.filter.outputs.library_tools == 'true' }}
      ghostty: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ghostty == 'true' || steps.filter.outputs.library_tools == 'true' }}
      hotkeys: ${{ github.event_name != 'pull_request' || steps.filter.outputs.hotkeys == 'true' || steps.filter.outputs.library_tools == 'true' }}
      web_shards: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.web_shards == '2' && '["1/2","2/2"]' || '["1/4","2/4","3/4","4/4"]' }}
      docs: ${{ steps.filter.outputs.docs == 'true' }}
      docs_files: ${{ steps.filter.outputs.docs_files }}
    steps:
      - name: Classify changed files
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            code:
              - '**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            web:
              - '**'
              - '!apps/tui/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            server:
              - '**'
              - '!apps/web/**'
              - '!apps/tui/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            tui:
              - '**'
              - '!apps/web/**'
              - '!apps/desktop/**'
              - '!apps/mac/**'
              - '!apps/site/**'
              - '!plans/**'
              - '!docs/**'
              - '!*.md'
            # Mirrors site.yml's own push paths: the site build bundles apps/web in
            # demo mode, so anything that can change that bundle belongs here too.
            site:
              - 'apps/site/**'
              - 'apps/web/**'
              - 'packages/**'
              - 'editor/**'
              - 'ghostty-webgpu/**'
              - 'scripts/build-site.ts'
              - 'scripts/dev-sources.ts'
              - 'scripts/runtime-network.ts'
              - '.github/actions/setup/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.github/workflows/site.yml'
            # Root tooling and Turbo's cross-family global inputs invalidate every family.
            library_tools:
              - '*'
              - '.github/**'
              - 'scripts/**'
              - 'patches/**'
              - '{editor,ghostty-webgpu,hotkeys}/{.oxlintrc.json,.oxfmtrc.json,tsconfig.json}'
              - 'editor/global.d.ts'
              - 'editor/scripts/build-package.ts'
              - 'editor/scripts/workspace-root*'
              - 'editor/examples/app/tsconfig.json'
              - '!*.md'
            editor:
              - 'editor/**'
            ghostty:
              - 'ghostty-webgpu/**'
            hotkeys:
              - 'hotkeys/**'
            # Written by `generated:check`'s generators, so a hand edit is a code change.
            generated:
              - 'docs/settings-reference.md'
              - 'docs/native-syntax-coverage.*'
            docs:
              - added|modified: 'plans/**'
              - added|modified: 'docs/**'
              - added|modified: '*.md'

  # No workspace's `format:check` reaches plans and docs, so their changed files are checked here.
  docs:
    name: Docs format
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Format
        env:
          FILES: ${{ needs.changes.outputs.docs_files }}
        run: |
          version=$(jq -r '.workspaces.catalog.oxfmt' package.json)
          jq -r '.[] | "./" + .' <<<"$FILES" | xargs -d '\n' bunx "oxfmt@$version" --check

  # Jobs instead of one runner doing everything in turn: each pays for setup once,
  # and no suite shares four cores with another.
  lint:
    name: Format, lint, census
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check shared tooling
        run: bun run workspace:check

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check

      # Workspaces lint in parallel (no dependency order to respect), and `apps/web`'s lint
      # already runs the root config's feature-boundary rules over all of `apps/web`.
      - name: Lint
        run: bun run lint

      - name: Query API
        run: bun run query:check

      - name: Document contribution ownership
        run: bun run documents:check

      - name: Structured errors census
        run: bun run errors:census

      - name: Design language census
        run: bun run design:census

      # Lint cannot stand in for this: its compiler rules miss components wrapped in `memo()`.
      - name: React Compiler census
        run: bun run compiler:census

      - name: Unused code
        run: bun run unused:check

  # Package tests share this runner with typechecking and generated checks.
  typecheck:
    name: Typecheck, generated, packages
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate dev task graph
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: bun run dev:web -- --dry-run=json > /dev/null

      - name: Install Linux webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev

      - name: Build Linux webview host
        run: bun run --cwd apps/desktop build:native

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated artifacts
        run: bun run generated:check

      # The one benchmark that survives a shared runner. Its thresholds are
      # ratios (remount speedup >= 0.2, cold slowdown <= 0.15), so runner speed
      # cancels out, and it is pure in-process: no browser, no server, no sibling
      # Editor checkout. ~4s, currently passing with ~4x margin. Every other
      # bench here gates on absolute milliseconds calibrated on one developer
      # machine, and `bench:editor-open:gate` cannot run in CI at all — its
      # calibration identity is a hash of `apps/web/src`, so any PR invalidates
      # it before a measurement happens.
      - name: Benchmark gate (file tree prepared input)
        run: bun run --cwd apps/web bench:file-tree-prepared-input:gate

      # Byte counts, not timings: a production build is deterministic, so this gate runs on a
      # shared runner. It builds itself and never reads a cached bundle-stats.json.
      - name: First-load gate
        run: bun run --cwd apps/web bundle:gate

      # Package tests also read app sources (the session vocabulary scans `apps/web`), so they
      # run for any code change.
      - name: Package tests
        if: ${{ !cancelled() }}
        run: bun run test:scripts && bun run --filter '@workspace/*' test && bun run --filter '@fregat/*' test && bun run --cwd apps/desktop test

  # Web is most of the time, so it is sharded by file, balanced by recorded durations
  # (`apps/web/test/shard-sequencer.ts`). The `test` scripts in `apps/web` and `packages/tree`
  # are scoped to `--project node --project dom`; their browser projects are the browser job.
  test-web:
    name: Test (web ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.web_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/web test --shard=${{ matrix.shard }} --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web-tests.json"

      - name: Save web test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-timings-${{ strategy.job-index }}
          path: ${{ runner.temp }}/web-tests.json
          if-no-files-found: warn
          retention-days: 14

  # By hash of the path: the recorded split was within 15% (207 s against 182 s of file time).
  test-server:
    name: Test (server ${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/server test --shard=${{ matrix.shard }}

  test-tui:
    name: Test (tui)
    needs: changes
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        run: bun run --cwd apps/tui test

  browser:
    name: Browser tests
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # The workspace's own playwright binary, never `bunx playwright` — bunx
      # resolves a fresh copy from npm and downloads the browser revision *that*
      # version wants, leaving the pinned playwright pointing at a build that
      # was never fetched.
      - name: Install Chromium
        timeout-minutes: 5
        uses: ./.github/actions/install-browsers
        with:
          playwright: apps/web/node_modules/.bin/playwright
          browsers: chromium

      - name: Agent browser doctor
        run: bun --bun vitest run scripts/agent/browser-doctor.test.ts --environment node

      - name: Agent browser shared memory
        if: ${{ !cancelled() }}
        run: bun --bun vitest run scripts/agent/browser-launch.test.ts --environment node

      - name: Browser resource teardown
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: bun --bun vitest run scripts/browser-gc.test.ts scripts/heavy/browser-gc.test.ts --environment node --no-file-parallelism

      - name: Cold dev startup
        if: ${{ !cancelled() }}
        run: bun --bun vitest run scripts/agent/vite-cold-start.test.ts --environment node

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      # Each run takes about a minute; a stuck one fails its step here, and the tree step
      # still runs, where the job timeout would cancel both.
      - name: Browser test (web)
        timeout-minutes: 5
        run: bun run --cwd apps/web test:browser

      - name: Browser test (syntax settings)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bun run --cwd apps/web test:syntax-settings-browser

      - name: Browser test (tree)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bun run --cwd apps/web test:tree-browser

      - name: Browser test (retention reload)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run --cwd apps/web test:retention-reload-browser

      - name: Upload failed retention reload evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: retention-reload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-acceptance-reload-*
          if-no-files-found: ignore

      - name: Browser test (retention layout)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run --cwd apps/web test:retention-layout-browser

      - name: Upload failed retention layout evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: retention-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-acceptance-layout-*
          if-no-files-found: ignore

  # The site's demo build bundles apps/web in a different mode than the app build, so it
  # pulls in packages (like MSW) the other CI jobs never touch and needs its own licence
  # check. Building it here is what site.yml's push-to-main build does, run before merge.
  site:
    name: Site build
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build landing page and interactive app
        working-directory: apps/site
        run: bun run site:build
      - name: Build Editor example
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/editor/
        run: bun x turbo run build --filter=@singapore-editor/example-app
      - name: Build ghostty site
        run: bun run --cwd ghostty-webgpu/site build --base /${{ github.event.repository.name }}/ghostty-webgpu/

  libraries:
    name: Libraries
    needs: changes
    if: ${{ needs.changes.outputs.editor == 'true' || needs.changes.outputs.ghostty == 'true' || needs.changes.outputs.hotkeys == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/workspace-libraries.yml
    with:
      editor: ${{ needs.changes.outputs.editor == 'true' }}
      ghostty: ${{ needs.changes.outputs.ghostty == 'true' }}
      standalone_editor: ${{ needs.changes.outputs.editor == 'true' }}
      standalone_ghostty: ${{ needs.changes.outputs.ghostty == 'true' }}
      standalone_hotkeys: ${{ needs.changes.outputs.hotkeys == 'true' }}

  # The one status to read: red when any job failed or was cancelled; a job skipped because the
  # change cannot affect it counts as passed.
  verdict:
    name: CI
    needs:
      [changes, docs, lint, typecheck, test-web, test-server, test-tui, browser, site, libraries]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Verdict
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate --slurp > "$RUNNER_TEMP/ci-jobs.json"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/ci-run.json"
          bun scripts/ci-verdict.ts .github/workflows/ci.yml "$RUNNER_TEMP/ci-jobs.json" "$RUNNER_TEMP/ci-run.json"
      - name: Report queue and execution times
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -r '
            def seconds: fromdateiso8601;
            "| Job | Queue seconds | Execution seconds |",
            "| --- | ---: | ---: |",
            (.[].jobs[] | select(.started_at != null and .completed_at != null and .conclusion != "skipped") |
              "| \(.name) | \((.started_at | seconds) - (.created_at | seconds)) | \((.completed_at | seconds) - (.started_at | seconds)) |")
          ' "$RUNNER_TEMP/ci-jobs.json" >> "$GITHUB_STEP_SUMMARY"
          created=$(jq -r '.created_at' "$RUNNER_TEMP/ci-run.json")
          started=$(jq -r '.[].jobs[] | select(.name == "CI") | .started_at' "$RUNNER_TEMP/ci-jobs.json")
          echo "Run created to verdict runner started: $(( $(date -d "$started" +%s) - $(date -d "$created" +%s) )) seconds" >> "$GITHUB_STEP_SUMMARY"
