name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      web_shards:
        description: Web shard count for turnaround measurements.
        type: choice
        default: '4'
        options: ['2', '4']

# Each ref keeps one running and one pending run; newer pushes replace older pending runs.
# PRs also cancel their running run; main lets its running run finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # API reads use a fresh runner with no checkout or repository code.
  baseline:
    name: Successful main baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - name: Read successful main baseline
        id: baseline
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.event.before != '0000000000000000000000000000000000000000' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=20" --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty')
          echo "sha=$baseline" >> "$GITHUB_OUTPUT"

  # PRs and main pushes select affected packages; scheduled and manual runs validate everything.
  changes:
    name: Changes
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      shared: ${{ steps.plan.outputs.shared }}
      tooling: ${{ steps.plan.outputs.tooling }}
      tree: ${{ steps.plan.outputs.tree }}
      sites: ${{ steps.plan.outputs.sites }}
      exhaustive: ${{ steps.plan.outputs.exhaustive }}
      packages: ${{ steps.plan.outputs.packages }}
      web: ${{ steps.plan.outputs.web }}
      server: ${{ steps.plan.outputs.server }}
      tui: ${{ steps.plan.outputs.tui }}
      desktop: ${{ steps.plan.outputs.desktop }}
      site: ${{ steps.plan.outputs.site }}
      web_shards: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.web_shards == '2' && '["1/2","2/2"]' || '["1/4","2/4","3/4","4/4"]' }}
      mobile_shards: >-
        ${{ steps.plan.outputs.exhaustive == 'true' && '["chromium-0","chromium-1","webkit-0","webkit-1"]' || '["chromium-0","webkit-0"]' }}
      docs: ${{ steps.plan.outputs.docs }}
      docs_files: ${{ steps.plan.outputs.docs_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Select affected packages
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASELINE_SHA: ${{ needs.baseline.outputs.sha }}
        run: |
          MODE=full
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            MODE=changed
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == refs/heads/* && -n "$BEFORE_SHA" && "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            MODE=changed
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$MODE" == 'changed' ]]; then
            if [[ -n "$BASELINE_SHA" ]] && git merge-base --is-ancestor "$BASELINE_SHA" "$HEAD_SHA"; then
              BASE_SHA="$BASELINE_SHA"
            else
              MODE=full
            fi
          fi
          bun scripts/ci/affected.mjs "$MODE" "$BASE_SHA" "$HEAD_SHA"

  # No workspace's `format:check` reaches plans and docs, so their changed files are checked here.
  docs:
    name: Docs format
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Format
        env:
          FILES: ${{ needs.changes.outputs.docs_files }}
        run: |
          version=$(jq -r '.workspaces.catalog.oxfmt' package.json)
          jq -j '.[] | "./" + . + "\u0000"' <<<"$FILES" |
            xargs -0 -r bunx "oxfmt@$version" --check --no-error-on-unmatched-pattern

  # Jobs instead of one runner doing everything in turn: each pays for setup once,
  # and no suite shares four cores with another.
  lint:
    name: Format, lint, census
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Check shared tooling
        run: bun run workspace:check

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check:root

      # Package formatting and linting run with the affected package checks.
      - name: Lint
        run: bun run plans:check && bun run dupes:functions && bun run dupes

      - name: Query API
        run: bun run query:check

      - name: Array construction
        run: bun run arrays:check

      - name: Document contribution ownership
        run: bun run documents:check

      - name: Structured errors census
        run: bun run errors:census

      - name: Design language census
        run: bun run design:census

      # Lint cannot stand in for this: its compiler rules miss components wrapped in `memo()`.
      - name: React Compiler census
        run: bun run compiler:census

      - name: Manual React memo check
        run: bun run compiler:memos:check

      - name: Unused code
        run: bun run unused:check

  # Build prerequisites once; suites start when their outputs are published.
  workspace-builds:
    name: Workspace builds
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'
      - name: Produce workspace builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: produce
          selection: ${{ toJSON(needs.changes.outputs) }}

  # Package tests share this runner with typechecking and generated checks.
  typecheck:
    name: Typecheck, generated, packages
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.shared == 'true' || needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: ${{ needs.changes.outputs.tooling == 'true' && 'all' || needs.changes.outputs.packages }}

      - name: Archive script test builds
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        run: |
          find packages -name node_modules -prune -o -type d -name dist -prune -print0 |
            tar --null -T - -czf "$RUNNER_TEMP/script-test-builds.tar.gz"

      - name: Share script test builds
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: script-test-builds
          compression-level: 0
          path: ${{ runner.temp }}/script-test-builds.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Validate dev task graph
        if: ${{ needs.changes.outputs.web == 'true' }}
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: bun run dev:web -- --dry-run=json > /dev/null

      - name: Install Linux webview build dependencies
        if: ${{ needs.changes.outputs.desktop == 'true' }}
        uses: ./.github/actions/linux-webview-deps

      - name: Build Linux webview host
        if: ${{ needs.changes.outputs.desktop == 'true' }}
        run: bun run --cwd apps/desktop build:native

      - name: Package checks
        env:
          CI_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: bun scripts/ci/packages.mjs checks "$CI_PACKAGES"

      - name: Check script types
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        run: bun run --cwd scripts typecheck

      - name: Check generated artifacts
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        run: bun run generated:check

      # The one benchmark that survives a shared runner. Its thresholds are
      # ratios (remount speedup >= 0.2, cold slowdown <= 0.15), so runner speed
      # cancels out, and it is pure in-process: no browser, no server, no sibling
      # Editor checkout. ~4s, currently passing with ~4x margin. Every other
      # bench here gates on absolute milliseconds calibrated on one developer
      # machine, and `bench:editor-open:gate` cannot run in CI at all — its
      # calibration identity is a hash of `apps/web/src`, so any PR invalidates
      # it before a measurement happens.
      - name: Benchmark gate (file tree prepared input)
        if: ${{ needs.changes.outputs.web == 'true' }}
        run: bun run --cwd apps/web bench:file-tree-prepared-input:gate

      # Script tests inspect the whole repository; package source readers are declared in Turbo.
      - name: Script tests
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        run: bun run test:scripts --exclude scripts/markdown/promotion-evidence.test.ts --exclude scripts/agent/browser-launch.test.ts --exclude scripts/browser-gc.test.ts

      - name: Package tests
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' }}
        env:
          CI_PACKAGES: ${{ needs.changes.outputs.packages }}
        run: bun scripts/ci/packages.mjs tests "$CI_PACKAGES"

  # The complete synthetic promotion controls need their own runner and full job budget.
  test-promotion-evidence:
    name: Script tests (promotion evidence)
    needs: [changes, typecheck]
    if: ${{ needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Download script test builds
        uses: actions/download-artifact@v4
        with:
          name: script-test-builds
          path: ${{ runner.temp }}

      - name: Restore script test builds
        run: tar -xzf "$RUNNER_TEMP/script-test-builds.tar.gz"

      - name: Script tests
        run: bun run test:scripts scripts/markdown/promotion-evidence.test.ts

  # Web is most of the time, so it is sharded by file, balanced by recorded durations
  # (`apps/web/test/shard-sequencer.ts`). The `test` scripts in `apps/web` and `packages/tree`
  # are scoped to `--project node --project dom`; their browser projects are the browser job.
  test-web:
    name: Test (web ${{ matrix.shard }})
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.web_shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: '["web"]'

      - name: Test
        run: bun run --cwd apps/web test --shard=${{ matrix.shard }} --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/web-tests.json"

      - name: Save web test timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-timings-${{ strategy.job-index }}
          path: ${{ runner.temp }}/web-tests.json
          if-no-files-found: warn
          retention-days: 14

  # By hash of the path: the recorded split was within 15% (207 s against 182 s of file time).
  test-server:
    name: Test (server ${{ matrix.shard }})
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: '["server"]'

      - name: Test
        run: bun run --cwd apps/server test --shard=${{ matrix.shard }}

  test-tui:
    name: Test (tui)
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: '["tui"]'

      - name: Test
        run: bun run --cwd apps/tui test

  browser:
    name: Browser tests
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.tree == 'true' || needs.changes.outputs.tooling == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: '["web"]'

      # The workspace's own playwright binary, never `bunx playwright` — bunx
      # resolves a fresh copy from npm and downloads the browser revision *that*
      # version wants, leaving the pinned playwright pointing at a build that
      # was never fetched.
      - name: Install Chromium
        timeout-minutes: 5
        uses: ./.github/actions/install-browsers
        with:
          playwright: apps/web/node_modules/.bin/playwright
          browsers: ${{ needs.changes.outputs.tooling == 'true' && 'chromium webkit' || 'chromium' }}

      - name: Agent browser doctor
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        run: bun --bun vitest run scripts/agent/browser-doctor.test.ts --environment node

      - name: Agent browser shared memory
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        run: bun --bun vitest run scripts/agent/browser-launch.test.ts --environment node

      - name: Scroll highlight range controls
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        run: bun --bun vitest run --config vitest.scripts.config.mjs scripts/editor-scroll-benchmark-ranges.test.mjs

      - name: Browser resource teardown
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        timeout-minutes: 2
        run: bun --bun vitest run scripts/browser-gc.test.ts --environment node --no-file-parallelism

      - name: Cold dev startup
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tooling == 'true' }}
        run: bun --bun vitest run scripts/agent/vite-cold-start.test.ts --environment node

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      # Each run takes about a minute; a stuck one fails its step here, and the tree step
      # still runs, where the job timeout would cancel both.
      - name: Browser test (web)
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        timeout-minutes: 5
        run: bun run --cwd apps/web test:browser

      - name: Browser test (syntax settings)
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        timeout-minutes: 5
        run: bun run --cwd apps/web test:syntax-settings-browser

      - name: Browser test (tree)
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.tree == 'true' }}
        timeout-minutes: 5
        run: bun run --cwd apps/web test:tree-browser

      - name: Browser test (retention reload)
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run --cwd apps/web test:retention-reload-browser

      - name: Upload failed retention reload evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: retention-reload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-acceptance-reload-*
          if-no-files-found: ignore

      - name: Browser test (retention layout)
        if: ${{ !cancelled() && steps.builds.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        timeout-minutes: 5
        env:
          TMPDIR: ${{ runner.temp }}
        run: bun run --cwd apps/web test:retention-layout-browser

      - name: Upload failed retention layout evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: retention-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retention-acceptance-layout-*
            ${{ runner.temp }}/retention-layout-*-failed-start.json
            ${{ runner.temp }}/retention-layout-*-server-evidence-*
          if-no-files-found: ignore

  site:
    name: Site build
    needs: [changes, workspace-builds]
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Import workspace builds
        id: builds
        uses: ./.github/actions/workspace-builds
        with:
          operation: consume
          targets: sites:${{ needs.changes.outputs.sites }}

      - name: Install Fregat site browsers
        uses: ./.github/actions/install-browsers
        with:
          playwright: scripts/node_modules/.bin/playwright
          browsers: chromium firefox webkit
      - name: Build production sites
        env:
          CI_SITES: ${{ needs.changes.outputs.sites }}
        run: bash scripts/product-sites/build.sh "$RUNNER_TEMP/product-sites" "$CI_SITES" --reuse-workspace-builds
      - name: Check deployment config and cache headers
        run: python3 -m unittest discover -s scripts/product-sites -p 'test_*.py'
      - name: Test landing page playback
        run: bun run test:scripts scripts/site-player.test.ts
      - name: Test mobile overflow detection
        if: ${{ needs.changes.outputs.tooling == 'true' }}
        run: bun scripts/product-sites/test-mobile.mjs
      - name: Check landing page focus, contrast and motion controls
        if: ${{ contains(needs.changes.outputs.sites, 'fregat') }}
        run: bun run --cwd apps/site verify:a11y
      - name: Check landing page reload scroll and first-paint layout
        if: ${{ contains(needs.changes.outputs.sites, 'fregat') }}
        run: |
          bun run --cwd apps/site verify:scroll --engine webkit
          bun run --cwd apps/site verify:scroll --engine chromium
          bun run --cwd apps/site verify:scroll --engine firefox
          bun run --cwd apps/site verify:scroll --engine firefox --generic-font monospace
      - name: Share production sites with mobile checks
        uses: actions/upload-artifact@v4
        with:
          name: ci-product-sites
          path: ${{ runner.temp }}/product-sites
          retention-days: 1

  mobile-layout:
    name: Mobile layout (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.mobile_shards) }}
    needs: [changes, site]
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          build-packages: '[]'

      - name: Download production sites
        uses: actions/download-artifact@v4
        with:
          name: ci-product-sites
          path: ${{ runner.temp }}/product-sites

      - name: Install mobile check browsers
        uses: ./.github/actions/install-browsers
        with:
          playwright: scripts/node_modules/.bin/playwright
          browsers: ${{ startsWith(matrix.shard, 'webkit') && 'webkit' || 'chromium' }}

      - name: Check production pages on mobile
        env:
          SHARD: ${{ matrix.shard }}
          EXHAUSTIVE: ${{ needs.changes.outputs.exhaustive }}
        run: |
          selection=(--paths /)
          if [[ "$EXHAUSTIVE" == 'true' ]]; then
            selection=(--shards 2 --shard "${SHARD##*-}")
          fi
          bun scripts/product-sites/verify-mobile.mjs --directory "$RUNNER_TEMP/product-sites/fregat" --evidence "$RUNNER_TEMP/mobile-layout/fregat" --engines "${SHARD%-*}" "${selection[@]}"

      - name: Upload mobile layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-${{ matrix.shard }}
          path: ${{ runner.temp }}/mobile-layout
          if-no-files-found: ignore
          retention-days: 7

  # The one status to read: red when any job failed or was cancelled; a job skipped because the
  # change cannot affect it counts as passed.
  verdict:
    name: CI
    needs:
      [
        baseline,
        changes,
        workspace-builds,
        docs,
        lint,
        typecheck,
        test-promotion-evidence,
        test-web,
        test-server,
        test-tui,
        browser,
        site,
        mobile-layout,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      # Execute only trusted main code; candidate workflows are parsed as data.
      - name: Checkout trusted verifier
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          path: trusted
          persist-credentials: false
      - name: Checkout candidate graph
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Fetch CI metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # The jobs API briefly lags dependency completion; unfinished jobs still fail the verdict.
          for attempt in $(seq 1 12); do
            gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate --slurp > "$RUNNER_TEMP/ci-jobs.json"
            pending=$(jq '[.[].jobs[] | select(.name != "CI" and .status != "completed")] | length' "$RUNNER_TEMP/ci-jobs.json")
            if [ "$pending" = 0 ]; then break; fi
            sleep 5
          done
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > "$RUNNER_TEMP/ci-run.json"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: trusted/package.json
      - name: Verdict
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bun trusted/scripts/ci-verdict.ts candidate/.github/workflows/ci.yml "$RUNNER_TEMP/ci-jobs.json" "$RUNNER_TEMP/ci-run.json"
      - name: Report queue and execution times
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -r '
            def seconds: fromdateiso8601;
            "| Job | Queue seconds | Execution seconds |",
            "| --- | ---: | ---: |",
            (.[].jobs[] | select(.started_at != null and .completed_at != null and .conclusion != "skipped") |
              "| \(.name) | \((.started_at | seconds) - (.created_at | seconds)) | \((.completed_at | seconds) - (.started_at | seconds)) |")
          ' "$RUNNER_TEMP/ci-jobs.json" >> "$GITHUB_STEP_SUMMARY"
          created=$(jq -r '.created_at' "$RUNNER_TEMP/ci-run.json")
          started=$(jq -r '.[].jobs[] | select(.name == "CI") | .started_at' "$RUNNER_TEMP/ci-jobs.json")
          echo "Run created to verdict runner started: $(( $(date -d "$started" +%s) - $(date -d "$created" +%s) )) seconds" >> "$GITHUB_STEP_SUMMARY"
