name: CI

# The health workflow runs `bun run health` and nothing else, so until now a pull request could go
# green with a failing test suite — which is exactly how a stale e2e spec reached review on the
# diff-as-editor branch. Typecheck, lint and unit tests all run here.
#
# `test:e2e` is deliberately not wired in yet: it needs a Playwright browser download and a built
# example app, which is a different cost profile. It is a separate follow-up, not a reason to keep
# the rest unrun.

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# A second push to a PR branch makes the first run's answer worthless. On main every run finishes,
# so main always has a verdict; pushes during a run collapse into one pending run of the newest
# commit, because GitHub keeps one pending run per group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Three jobs side by side: checks, core's tests (the longest, and the only ones that need
  # Firefox and WebKit), and every other package's tests.
  check:
    name: Typecheck, lint, catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check turbo inputs
        run: bun scripts/check-turbo-inputs.mjs

      - name: Check native language catalog
        run: bun run --cwd packages/tree-sitter-languages languages:generate -- --check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Every save carries the restored entries forward, so entries written over three days ago go;
      # one still in use is rebuilt once.
      - name: Prune turbo cache
        if: ${{ always() }}
        run: find .turbo/cache -type f -mtime +3 -delete 2>/dev/null || true

  core:
    name: Test (core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      # Browser projects check geometry and CSS behavior that happy-dom cannot reproduce.
      # Run the workspace's own Playwright, not `bunx playwright` — bare `bunx` fetches the latest
      # from the registry, which downloads browsers into a revision directory the pinned 1.60.0
      # does not look in, so the install "succeeds" and the launch still fails.
      #
      # Chromium and its headless shell, deliberately: vitest browser mode runs `headless: true`,
      # which launches `chrome-headless-shell`, a separate download from `chromium`. Firefox and
      # WebKit are for core's highlight-paint project.
      - name: Install Playwright browsers
        working-directory: packages/editor
        run: ./node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell firefox webkit

      - name: Test
        run: bun run test -- --filter=@singapore-editor/core

      - name: Prune turbo cache
        if: ${{ always() }}
        run: find .turbo/cache -type f -mtime +3 -delete 2>/dev/null || true

  packages:
    name: Test (packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        working-directory: packages/editor
        run: ./node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell

      # The worker test imports built packages; turbo replays the build from the cache.
      - name: Build packages
        run: bun run build -- --filter='./packages/*'

      - name: Test tree-sitter browser worker
        run: bun run --cwd packages/tree-sitter test:browser

      # Packages without browser projects share the runner. Everything else, a new package
      # included until it is listed here, runs one package at a time to keep browser processes
      # within the runner's capacity.
      - name: Test (no browser)
        run: >-
          bun run test --
          --filter=@singapore-editor/decode
          --filter=@singapore-editor/diff
          --filter=@singapore-editor/gutters
          --filter=@singapore-editor/lsp
          --filter=@singapore-editor/lsp-plugin
          --filter=@singapore-editor/markdown
          --filter=@singapore-editor/panes
          --filter=@singapore-editor/textbuffer
          --filter=@singapore-editor/tree-sitter-languages
          --filter=@singapore-editor/typescript-lsp

      - name: Test (browser)
        if: ${{ !cancelled() }}
        run: >-
          bun run test -- --concurrency=1
          --filter=!@singapore-editor/core
          --filter=!@singapore-editor/decode
          --filter=!@singapore-editor/diff
          --filter=!@singapore-editor/gutters
          --filter=!@singapore-editor/lsp
          --filter=!@singapore-editor/lsp-plugin
          --filter=!@singapore-editor/markdown
          --filter=!@singapore-editor/panes
          --filter=!@singapore-editor/textbuffer
          --filter=!@singapore-editor/tree-sitter-languages
          --filter=!@singapore-editor/typescript-lsp

      - name: Prune turbo cache
        if: ${{ always() }}
        run: find .turbo/cache -type f -mtime +3 -delete 2>/dev/null || true
