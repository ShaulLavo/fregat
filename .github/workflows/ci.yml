name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the linked Editor API and Platform consumers on an exact revision.
  EDITOR_REF: 30ae9ec86807c6304dc8ef881bffa2dfb6dd6ccc
  # Same for the linked ghostty-webgpu checkout.
  GHOSTTY_REF: 796d087851a036466bf49bbf0a4f0f037aed6da9

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          editor-ref: ${{ env.EDITOR_REF }}
          ghostty-ref: ${{ env.GHOSTTY_REF }}

      - name: Validate dev task graph
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: bun run dev:web -- --dry-run=json > /dev/null

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated artifacts
        run: bun run generated:check

      # The one benchmark that survives a shared runner. Its thresholds are
      # ratios (remount speedup >= 0.2, cold slowdown <= 0.15), so runner speed
      # cancels out, and it is pure in-process: no browser, no server, no sibling
      # Editor checkout. ~4s, currently passing with ~4x margin. Every other
      # bench here gates on absolute milliseconds calibrated on one developer
      # machine, and `bench:editor-open:gate` cannot run in CI at all — its
      # calibration identity is a hash of `apps/web/src`, so any PR invalidates
      # it before a measurement happens.
      - name: Benchmark gate (file tree prepared input)
        run: bun run --cwd apps/web bench:file-tree-prepared-input:gate

      # Runs the scripts suite plus every workspace's own. The `test` scripts in
      # `apps/web` and `packages/tree` are scoped to `--project node --project
      # dom`; their browser projects are the separate job below.
      - name: Test
        run: bun run test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          editor-ref: ${{ env.EDITOR_REF }}
          ghostty-ref: ${{ env.GHOSTTY_REF }}

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # The workspace's own playwright binary, never `bunx playwright` — bunx
      # resolves a fresh copy from npm and downloads the browser revision *that*
      # version wants, leaving the pinned playwright pointing at a build that
      # was never fetched.
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      - name: Browser test (web)
        run: bun run --cwd apps/web test:browser

      - name: Browser test (tree)
        if: ${{ !cancelled() }}
        run: bun run --cwd packages/tree test:browser
