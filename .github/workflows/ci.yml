name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to a PR branch makes the first run's answer worthless. On main every
# run finishes, so main always has a verdict; pushes during a run collapse into one
# pending run of the newest commit, because GitHub keeps one pending run per group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Three jobs and a test matrix instead of one runner doing everything in turn:
  # each pays for setup once, and no suite shares four cores with another.
  lint:
    name: Format, lint, census
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      # `format:check`, never `format` — a CI job that rewrites files and then
      # passes is a job that reports on a tree nobody reviewed.
      - name: Format
        run: bun run format:check

      # Workspaces lint in parallel (no dependency order to respect), and `apps/web`'s lint
      # already runs the root config's feature-boundary rules over all of `apps/web`.
      - name: Lint
        run: bun run lint

      - name: Query API
        run: bun run query:check

      - name: Design language census
        run: bun run design:census

      # Lint cannot stand in for this: its compiler rules miss components wrapped in `memo()`.
      - name: React Compiler census
        run: bun run compiler:census

      - name: Unused code
        run: bun run unused:check

  typecheck:
    name: Parity, typecheck, generated
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          alignment-reference: true

      - name: Alignment evidence records
        run: python3 scripts/parity/check.py

      - name: Alignment operation and source census
        run: python3 scripts/parity/source.py --reference references/t3code

      - name: Pinned snooze wake comparison
        run: bun scripts/parity/wake.ts

      - name: Pinned snooze calendar comparison
        run: bun scripts/parity/snooze.ts

      - name: Pinned ordering policy comparison
        run: bun scripts/parity/ordering.ts

      - name: Pinned response delivery comparison
        run: bun scripts/parity/response-delivery.ts

      - name: Pinned background liveness comparison
        run: bun scripts/parity/background.ts

      - name: Pinned queued follow-up policy comparison
        run: >-
          python3 -B scripts/parity/run.py
          --operation client-command:thread.turn.start
          --scenario follow-up-queue-policy
          --check

      - name: Alignment checker negative cases
        run: python3 -B -m unittest discover -s scripts/parity -p 'test_*.py'

      - name: Pinned model option comparison
        run: bun scripts/parity/model-options.ts

      - name: Validate dev task graph
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: bun run dev:web -- --dry-run=json > /dev/null

      # Electrobun 2 ships its SDK as a Hutch devkit projected into
      # apps/desktop/.hutch, not through node_modules, so the desktop typecheck
      # and tests resolve nothing until it exists. Keyed on the pinned release;
      # the store is about 700 MB, so a cold prepare is a real download.
      - name: Cache Hutch store
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('apps/desktop/package.json') }}

      - name: Prepare Electrobun devkit
        working-directory: apps/desktop
        run: node_modules/.bin/electrobun prepare

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated artifacts
        run: bun run generated:check

      # The one benchmark that survives a shared runner. Its thresholds are
      # ratios (remount speedup >= 0.2, cold slowdown <= 0.15), so runner speed
      # cancels out, and it is pure in-process: no browser, no server, no sibling
      # Editor checkout. ~4s, currently passing with ~4x margin. Every other
      # bench here gates on absolute milliseconds calibrated on one developer
      # machine, and `bench:editor-open:gate` cannot run in CI at all — its
      # calibration identity is a hash of `apps/web/src`, so any PR invalidates
      # it before a measurement happens.
      - name: Benchmark gate (file tree prepared input)
        run: bun run --cwd apps/web bench:file-tree-prepared-input:gate

      # Byte counts, not timings: a production build is deterministic, so this gate runs on a
      # shared runner. It builds itself and never reads a cached bundle-stats.json.
      - name: First-load gate
        run: bun run --cwd apps/web bundle:gate

  test:
    name: Test (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          # Web is most of the time, so it is sharded by file. The `test` scripts
          # in `apps/web` and `packages/tree` are scoped to `--project node --project
          # dom`; their browser projects are the separate job below.
          - { name: web 1/4, run: 'bun run --cwd apps/web test --shard=1/4' }
          - { name: web 2/4, run: 'bun run --cwd apps/web test --shard=2/4' }
          - { name: web 3/4, run: 'bun run --cwd apps/web test --shard=3/4' }
          - { name: web 4/4, run: 'bun run --cwd apps/web test --shard=4/4' }
          - { name: server, run: 'bun run --cwd apps/server test' }
          - { name: tui, run: 'bun run --cwd apps/tui test' }
          - name: packages
            devkit: true
            run: bun run test:scripts && bun run --filter '@workspace/*' test && bun run --cwd apps/desktop test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          alignment-reference: true

      - name: Cache Hutch store
        if: ${{ matrix.suite.devkit }}
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: ${{ runner.os }}-hutch-${{ hashFiles('apps/desktop/package.json') }}

      - name: Prepare Electrobun devkit
        if: ${{ matrix.suite.devkit }}
        working-directory: apps/desktop
        run: node_modules/.bin/electrobun prepare

      - name: Test
        run: ${{ matrix.suite.run }}

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # The workspace's own playwright binary, never `bunx playwright` — bunx
      # resolves a fresh copy from npm and downloads the browser revision *that*
      # version wants, leaving the pinned playwright pointing at a build that
      # was never fetched.
      - name: Install Chromium
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium

      # Plain Node, not `--bun`: Vitest browser orchestration breaks under Bun.
      - name: Browser test (web)
        run: bun run --cwd apps/web test:browser

      - name: Browser test (tree)
        if: ${{ !cancelled() }}
        run: bun run --cwd packages/tree test:browser
