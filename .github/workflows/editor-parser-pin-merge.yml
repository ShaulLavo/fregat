name: Merge parser pins

on:
  workflow_run:
    workflows: [CI, tree-sitter-x]
    types: [completed]

permissions: {}

# Serialize publication, stale-PR cleanup, and merging across both workflows.
concurrency:
  group: tree-sitter-x-update
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      # Never check out the triggering branch or execute a downloaded artifact.
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Merge the verified parser pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/parser-pins.mjs merge
