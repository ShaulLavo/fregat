name: Collaboration session

on:
  pull_request:
    paths:
      - 'editor/packages/collaboration/**'
      - 'editor/packages/collab/**'
      - 'editor/packages/editor/**'
      - 'editor/examples/app/**'
      - 'editor/scripts/build-package.ts'
      - 'editor/tsconfig.json'
      - 'bun.lock'
      - '.github/workflows/editor-collaboration.yml'
  push:
    branches: ['main']
    paths:
      - 'editor/packages/collaboration/**'
      - 'editor/packages/collab/**'
      - 'editor/packages/editor/**'
      - 'editor/examples/app/**'
      - 'bun.lock'
      - '.github/workflows/editor-collaboration.yml'
  workflow_dispatch:
    inputs:
      long_run:
        description: Run 10,000 deterministic network simulations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build package and editor dependencies
        run: bunx turbo run build --filter=@singapore-editor/collaboration...
      - name: Check types, lint and formatting
        run: |
          bun run --cwd editor/packages/collaboration typecheck
          bun run --cwd editor/packages/collaboration lint
          bun run --cwd editor/packages/collaboration format:check
      - name: Verify session and network invariants
        env:
          COLLABORATION_LONG_RUN: ${{ inputs.long_run && '1' || '0' }}
        run: bun run --cwd editor/packages/collaboration test
      - name: Verify self-hosted signaling broker
        run: bun run --cwd editor/packages/collaboration test:server
      - name: Install Chromium
        uses: ./.github/actions/install-browsers
        with:
          playwright: editor/packages/editor/node_modules/.bin/playwright
          browsers: chromium
      - name: Verify native WebRTC, same-origin tabs and presence
        run: bun run --cwd editor/packages/collaboration test:browser
      - name: Verify concurrent editor input and author undo
        run: bun run --cwd editor/packages/collaboration test:editor
