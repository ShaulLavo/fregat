name: site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The site has no dependency on the rest of the workspace, and the
      # workspace root cannot install without the linked editor and terminal
      # checkouts. Build it as a standalone package instead.
      - name: Build outside the workspace
        run: |
          cp -r apps/site /tmp/site
          cd /tmp/site
          bun install
          bun run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
