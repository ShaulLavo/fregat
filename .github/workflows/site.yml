name: site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - apps/web/**
      - packages/**
      - editor/**
      - ghostty-webgpu/**
      - scripts/build-site.ts
      - scripts/dev-sources.ts
      - scripts/runtime-network.ts
      - .github/actions/setup/**
      - package.json
      - bun.lock
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build landing page and interactive app
        working-directory: apps/site
        run: bun run site:build
      - name: Build Editor example
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/editor/
        run: bun x turbo run build --filter=@singapore-editor/example-app
      - name: Build ghostty site
        run: bun run --cwd ghostty-webgpu/site build -- --base /${{ github.event.repository.name }}/ghostty-webgpu/
      - name: Assemble family sites
        run: |
          cp -R editor/examples/app/dist apps/site/dist/editor
          cp -R ghostty-webgpu/site/dist apps/site/dist/ghostty-webgpu
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
