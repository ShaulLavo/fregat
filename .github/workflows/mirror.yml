name: Mirrors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: packages/singapore
            previous_folder: editor
            repository: ShaulLavo/singapore
            deploy_key: MIRROR_EDITOR_SSH_KEY
          - folder: packages/ghostty-webgpu
            previous_folder: ghostty-webgpu
            repository: ShaulLavo/ghostty-webgpu
            deploy_key: MIRROR_GHOSTTY_SSH_KEY
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure repository deploy key
        env:
          MIRROR_SSH_KEY: ${{ secrets[matrix.deploy_key] }}
          MIRROR_KEY_SECRET: ${{ matrix.deploy_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_SSH_KEY" ]; then
            echo "::error::Configure $MIRROR_KEY_SECRET to push this mirror."
            exit 1
          fi
          key_dir="$RUNNER_TEMP/mirror-ssh"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key_dir/id_ed25519"
          chmod 600 "$key_dir/id_ed25519"
          cp "$GITHUB_WORKSPACE/.github/github_known_hosts" "$key_dir/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i '$key_dir/id_ed25519' -o IdentitiesOnly=yes -o UserKnownHostsFile='$key_dir/known_hosts' -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Split and push family
        env:
          FAMILY_FOLDER: ${{ matrix.folder }}
          FAMILY_PREVIOUS_FOLDER: ${{ matrix.previous_folder }}
          FAMILY_RELOCATION_COMMIT: ddf0527c59168f51e96bc0a96e68e0771cdbaadd
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::notice::Mirror skipped: a newer main snapshot is available.'
            exit 0
          fi
          if [ "$(git cat-file -t "HEAD:$FAMILY_FOLDER" 2>/dev/null || true)" != tree ]; then
            echo "::notice::Mirror skipped: $FAMILY_FOLDER has not landed yet."
            exit 0
          fi
          # Dash caps recursion at 1000 calls; the imported history needs Bash.
          git_exec_path="$(git --exec-path)"
          split_family() {
            GIT_EXEC_PATH="$git_exec_path" PATH="$git_exec_path:$PATH" bash "$git_exec_path/git-subtree" split --prefix="$1" "$2"
          }
          split_revision=HEAD
          if [ -n "${FAMILY_PREVIOUS_FOLDER:-}" ]; then
            git merge-base --is-ancestor "$FAMILY_RELOCATION_COMMIT" HEAD
            previous_main=$(git rev-parse "$FAMILY_RELOCATION_COMMIT^")
            previous_split=$(split_family "$FAMILY_PREVIOUS_FOLDER" "$previous_main")
            # Rejoin metadata connects the renamed prefix to its existing split history.
            # This temporary commit leaves HEAD and the checkout unchanged.
            split_revision=$(printf 'Seed relocated subtree history\n\ngit-subtree-dir: %s\ngit-subtree-mainline: %s\ngit-subtree-split: %s\n' \
              "$FAMILY_FOLDER" "$previous_main" "$previous_split" | \
              git -c user.name='Fregat mirrors' -c user.email='mirrors@users.noreply.github.com' \
              commit-tree HEAD^{tree} -p HEAD -p "$previous_split")
          fi
          split=$(split_family "$FAMILY_FOLDER" "$split_revision")
          if [ "$(git rev-parse "$split^{tree}")" != "$(git rev-parse "HEAD:$FAMILY_FOLDER")" ]; then
            echo "::error::Mirror split tree differs from $FAMILY_FOLDER."
            exit 1
          fi
          if ! git push "git@github.com:$MIRROR_REPOSITORY.git" "$split:refs/heads/main"; then
            echo "::error::Mirror push rejected or failed for $MIRROR_REPOSITORY. Reconcile its main with the family split before retrying."
            exit 1
          fi

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/mirror-ssh/id_ed25519"
