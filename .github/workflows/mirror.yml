name: Mirrors

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: editor
            repository: ShaulLavo/singapore
          - folder: ghostty-webgpu
            repository: ShaulLavo/ghostty-webgpu
          - folder: hotkeys
            repository: ShaulLavo/hotkeys
    steps:
      - name: Check mirror token
        id: token
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -n "$MIRROR_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Mirrors skipped: configure MIRROR_TOKEN to enable them.'
          fi

      - name: Checkout full history
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split and push family
        if: steps.token.outputs.enabled == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          FAMILY_FOLDER: ${{ matrix.folder }}
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::notice::Mirror skipped: a newer main snapshot is available.'
            exit 0
          fi
          if [ ! -d "$FAMILY_FOLDER" ]; then
            echo "::notice::Mirror skipped: $FAMILY_FOLDER has not landed yet."
            exit 0
          fi
          split=$(git subtree split --prefix="$FAMILY_FOLDER" HEAD)
          credentials=$(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)
          echo "::add-mask::$credentials"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credentials" \
            push "https://github.com/$MIRROR_REPOSITORY.git" "$split:refs/heads/main"; then
            echo "::error::Mirror push rejected or failed for $MIRROR_REPOSITORY. Reconcile its main with the family split before retrying."
            exit 1
          fi
