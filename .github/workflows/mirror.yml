name: Mirrors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirrors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: editor
            repository: ShaulLavo/singapore
            deploy_key: MIRROR_EDITOR_SSH_KEY
          - folder: ghostty-webgpu
            repository: ShaulLavo/ghostty-webgpu
            deploy_key: MIRROR_GHOSTTY_SSH_KEY
          - folder: hotkeys
            repository: ShaulLavo/hotkeys
            deploy_key: MIRROR_HOTKEYS_SSH_KEY
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure repository deploy key
        env:
          MIRROR_SSH_KEY: ${{ secrets[matrix.deploy_key] }}
          MIRROR_KEY_SECRET: ${{ matrix.deploy_key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_SSH_KEY" ]; then
            echo "::error::Configure $MIRROR_KEY_SECRET to push this mirror."
            exit 1
          fi
          key_dir="$RUNNER_TEMP/mirror-ssh"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s\n' "$MIRROR_SSH_KEY" > "$key_dir/id_ed25519"
          chmod 600 "$key_dir/id_ed25519"
          cp "$GITHUB_WORKSPACE/.github/github_known_hosts" "$key_dir/known_hosts"
          echo "GIT_SSH_COMMAND=ssh -i '$key_dir/id_ed25519' -o IdentitiesOnly=yes -o UserKnownHostsFile='$key_dir/known_hosts' -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Split and push family
        env:
          FAMILY_FOLDER: ${{ matrix.folder }}
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo '::notice::Mirror skipped: a newer main snapshot is available.'
            exit 0
          fi
          if [ "$(git cat-file -t "HEAD:$FAMILY_FOLDER" 2>/dev/null || true)" != tree ]; then
            echo "::notice::Mirror skipped: $FAMILY_FOLDER has not landed yet."
            exit 0
          fi
          # Dash caps recursion at 1000 calls; the imported history needs Bash.
          git_exec_path="$(git --exec-path)"
          split=$(GIT_EXEC_PATH="$git_exec_path" PATH="$git_exec_path:$PATH" bash "$git_exec_path/git-subtree" split --prefix="$FAMILY_FOLDER" HEAD)
          if ! git push "git@github.com:$MIRROR_REPOSITORY.git" "$split:refs/heads/main"; then
            echo "::error::Mirror push rejected or failed for $MIRROR_REPOSITORY. Reconcile its main with the family split before retrying."
            exit 1
          fi

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/mirror-ssh/id_ed25519"
