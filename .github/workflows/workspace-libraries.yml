name: Workspace libraries

on:
  workflow_call:
    inputs:
      exhaustive:
        type: boolean
        default: false
      packages:
        type: string
        default: all
      editor:
        type: boolean
        default: true
      ghostty:
        type: boolean
        default: true
      standalone_editor:
        type: boolean
        default: true
      standalone_ghostty:
        type: boolean
        default: true
      standalone_hotkeys:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Editor tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.editor }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-packages: editor
      - name: Install Editor browsers
        timeout-minutes: 8
        uses: ./.github/actions/install-browsers
        with:
          playwright: editor/packages/editor/node_modules/.bin/playwright
          browsers: chromium chromium-headless-shell firefox webkit
      - name: Check full-document benchmark probes
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"singapore-browser-compare"') }}
        run: bun run --cwd editor/bench/compare test
      - name: Build full-document benchmark
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.exhaustive }}
        timeout-minutes: 3
        run: bun run --cwd editor/bench/compare build:full
      - name: Smoke complete syntax output
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.exhaustive }}
        timeout-minutes: 2
        run: bun run --cwd editor/bench/compare smoke:full --output "$RUNNER_TEMP/singapore-full-smoke"
      - name: Smoke dense syntax lifecycle
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.exhaustive }}
        timeout-minutes: 3
        run: bun run --cwd editor/bench/compare smoke:full --corpus dense-injected --lifecycle --timeout 150000 --output "$RUNNER_TEMP/singapore-dense-smoke"
      - name: Keep dense syntax lifecycle evidence
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || inputs.exhaustive) }}
        uses: actions/upload-artifact@v4
        with:
          name: singapore-dense-smoke
          path: ${{ runner.temp }}/singapore-dense-smoke
          if-no-files-found: ignore
      - name: Keep full-document smoke evidence
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || inputs.exhaustive) }}
        uses: actions/upload-artifact@v4
        with:
          name: singapore-full-smoke
          path: ${{ runner.temp }}/singapore-full-smoke
          if-no-files-found: ignore
      - name: Check generated language catalog
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/tree-sitter-languages"') }}
        run: bun run --cwd editor/packages/tree-sitter-languages languages:generate -- --check
      - name: Check task inputs
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.exhaustive }}
        run: bun editor/scripts/check-turbo-inputs.mjs
      - name: Check architecture health
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.exhaustive }}
        run: bun run --cwd editor health
      - name: Test Editor packages and examples
        env:
          CI_PACKAGES: ${{ inputs.packages || 'all' }}
        run: bun scripts/ci/packages.mjs editor-tests "$CI_PACKAGES"
      - name: Test complete document snapshot paint
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/core"') }}
        run: |
          for engine in chromium webkit; do
            for dpr in 1 2 3; do
              bun run --cwd editor/packages/editor bench:paint --project "snapshot-${engine}-dpr${dpr}"
            done
          done
      - name: Test collaboration signaling broker
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/collaboration"') }}
        run: bun run --cwd editor/packages/collaboration test:server
      - name: Test tree-sitter browser worker
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/tree-sitter"') }}
        run: bun run --cwd editor/packages/tree-sitter test:browser
      - name: Test collaboration presence in Chromium
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/collaboration"') }}
        run: bun x turbo run test:browser --filter=@singapore-editor/collaboration --concurrency=1 -- test/presence.browser.test.ts
      - name: Test collaboration transports in Chromium
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/collaboration"') }}
        run: bun run --cwd editor/packages/collaboration test:browser -- test/transports.browser.test.ts
      - name: Smoke concurrent editor input and author undo
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"@singapore-editor/collaboration"') }}
        run: bun run --cwd editor/packages/collaboration test:editor -- test/editor.browser.test.ts --testNamePattern '2 simple editors preserve concurrent forward runs and author undo'

  ghostty:
    name: Ghostty tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.ghostty }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          build-packages: '["ghostty-webgpu","ghostty-webgpu-line-editor"]'
      - name: Install Chromium
        timeout-minutes: 5
        uses: ./.github/actions/install-browsers
        with:
          playwright: ghostty-webgpu/node_modules/.bin/playwright
          browsers: chromium
      - name: Verify line editor package
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"ghostty-webgpu-line-editor"') }}
        run: bun run --cwd ghostty-webgpu-line-editor verify
      - name: Verify terminal library and browser package
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"ghostty-webgpu"') }}
        run: bun run --cwd ghostty-webgpu verify
      - name: Verify browser package with production npm settings
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"ghostty-webgpu"') }}
        env:
          NODE_ENV: production
          npm_config_omit: dev
        run: bun run --cwd ghostty-webgpu test:package
      - name: Classify native resolver state
        if: ${{ inputs.packages == 'all' || github.event_name == 'workflow_dispatch' || contains(inputs.packages, '"ghostty-webgpu"') }}
        id: native-state
        working-directory: ghostty-webgpu
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          if [[ "$state" != 'bootstrap' && "$state" != 'assembled' ]]; then
            echo 'native resolver state classifier returned an invalid state' >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Verify assembled host package
        if: ${{ steps.native-state.outputs.state == 'assembled' }}
        run: bun run --cwd ghostty-webgpu test:package:host

  standalone:
    name: Standalone packages
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.standalone_editor || inputs.standalone_ghostty || inputs.standalone_hotkeys }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Standalone Editor
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_editor) }}
        uses: ./.github/actions/standalone
        with:
          family: editor
      - name: Standalone Ghostty
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_ghostty) }}
        uses: ./.github/actions/standalone
        with:
          family: ghostty-webgpu
      - name: Standalone Hotkeys
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_hotkeys) }}
        uses: ./.github/actions/standalone
        with:
          family: hotkeys
