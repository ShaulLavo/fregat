name: Workspace libraries

on:
  workflow_call:
    inputs:
      editor:
        type: boolean
        default: true
      ghostty:
        type: boolean
        default: true
      standalone_editor:
        type: boolean
        default: true
      standalone_ghostty:
        type: boolean
        default: true
      standalone_hotkeys:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Editor tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.editor }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Editor browsers
        timeout-minutes: 8
        uses: ./.github/actions/install-browsers
        with:
          playwright: editor/packages/editor/node_modules/.bin/playwright
          browsers: chromium chromium-headless-shell firefox webkit
      - name: Check generated language catalog
        run: bun run --cwd editor/packages/tree-sitter-languages languages:generate -- --check
      - name: Check task inputs
        run: bun editor/scripts/check-turbo-inputs.mjs
      - name: Check architecture health
        run: bun run --cwd editor health
      - name: Test Editor packages and examples
        run: bun x turbo run test --filter='./editor/packages/*' --filter='./editor/examples/*' --concurrency=1
      - name: Test tree-sitter browser worker
        run: bun run --cwd editor/packages/tree-sitter test:browser
      - name: Test collaboration presence in Chromium
        run: bun x turbo run test:browser --filter=@singapore-editor/collaboration --concurrency=1 -- test/presence.browser.test.ts

  ghostty:
    name: Ghostty tests
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.ghostty }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Chromium
        timeout-minutes: 5
        uses: ./.github/actions/install-browsers
        with:
          playwright: ghostty-webgpu/node_modules/.bin/playwright
          browsers: chromium
      - name: Verify line editor package
        run: bun run --cwd ghostty-webgpu-line-editor verify
      - name: Verify terminal library and browser package
        run: bun run --cwd ghostty-webgpu verify
      - name: Verify browser package with production npm settings
        env:
          NODE_ENV: production
          npm_config_omit: dev
        run: bun run --cwd ghostty-webgpu test:package
      - name: Classify native resolver state
        id: native-state
        working-directory: ghostty-webgpu
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          if [[ "$state" != 'bootstrap' && "$state" != 'assembled' ]]; then
            echo 'native resolver state classifier returned an invalid state' >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Verify assembled host package
        if: ${{ steps.native-state.outputs.state == 'assembled' }}
        run: bun run --cwd ghostty-webgpu test:package:host

  standalone:
    name: Standalone packages
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.standalone_editor || inputs.standalone_ghostty || inputs.standalone_hotkeys }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Standalone Editor
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_editor) }}
        uses: ./.github/actions/standalone
        with:
          family: editor
      - name: Standalone Ghostty
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_ghostty) }}
        uses: ./.github/actions/standalone
        with:
          family: ghostty-webgpu
      - name: Standalone Hotkeys
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || inputs.standalone_hotkeys) }}
        uses: ./.github/actions/standalone
        with:
          family: hotkeys
