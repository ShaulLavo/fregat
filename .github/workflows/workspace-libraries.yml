name: Workspace libraries

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    name: Editor tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-chromium-headless-shell-firefox-webkit-${{ hashFiles('bun.lock') }}
      - name: Install Editor browsers
        timeout-minutes: 5
        run: editor/packages/editor/node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell firefox webkit
      - name: Check generated language catalog
        run: bun run --cwd editor/packages/tree-sitter-languages languages:generate -- --check
      - name: Check task inputs
        run: bun editor/scripts/check-turbo-inputs.mjs
      - name: Check architecture health
        run: bun run --cwd editor health
      - name: Test Editor packages and examples
        run: bun x turbo run test --filter='./editor/packages/*' --filter='./editor/examples/*' --concurrency=1
      - name: Test tree-sitter browser worker
        run: bun run --cwd editor/packages/tree-sitter test:browser

  ghostty:
    name: Ghostty tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        timeout-minutes: 5
        run: ghostty-webgpu/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify terminal library and browser package
        run: bun run --cwd ghostty-webgpu verify
      - name: Verify browser package with production npm settings
        env:
          NODE_ENV: production
          npm_config_omit: dev
        run: bun run --cwd ghostty-webgpu test:package
      - name: Classify native resolver state
        id: native-state
        working-directory: ghostty-webgpu
        run: |
          set -euo pipefail
          state="$(bun scripts/verify-config-resolver-artifacts.ts --state either)"
          if [[ "$state" != 'bootstrap' && "$state" != 'assembled' ]]; then
            echo 'native resolver state classifier returned an invalid state' >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Verify assembled host package
        if: ${{ steps.native-state.outputs.state == 'assembled' }}
        run: bun run --cwd ghostty-webgpu test:package:host

  standalone:
    name: Standalone ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [editor, ghostty-webgpu, hotkeys]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Export exact mirror folder
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p "$RUNNER_TEMP/mirror"
          git archive "HEAD:$FAMILY" | tar -x -C "$RUNNER_TEMP/mirror"
      - name: Install and verify standalone package graph
        working-directory: ${{ runner.temp }}/mirror
        run: bun install && bun run build && bun run typecheck && bun run lint && bun run format:check
      - name: Check standalone tree-sitter runtime
        if: ${{ matrix.family == 'editor' }}
        working-directory: ${{ runner.temp }}/mirror
        run: bun run --cwd packages/tree-sitter test:runtime
      - name: Check hoisted standalone tree-sitter runtime
        if: ${{ matrix.family == 'editor' }}
        run: |
          mkdir -p "$RUNNER_TEMP/mirror-hoisted"
          git archive HEAD:editor | tar -x -C "$RUNNER_TEMP/mirror-hoisted"
          cd "$RUNNER_TEMP/mirror-hoisted"
          bun install --linker=hoisted
          bun run --cwd packages/tree-sitter test:runtime
