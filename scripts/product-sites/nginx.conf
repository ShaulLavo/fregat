map $uri $site_cache_control {
    default "public, max-age=0, must-revalidate";
    ~*\.html$ "public, max-age=60, must-revalidate";
    "~/(?:_astro|assets)/[^/]+[.-](?=[A-Za-z0-9_-]{8}\.)[A-Za-z0-9_-]*[0-9A-Z_][A-Za-z0-9_-]*\.(?:js|css|woff2?|png|jpe?g|svg|webp|wasm)$" "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /srv/sites/current;
    index index.html;
    autoindex off;
    absolute_redirect off;
    add_header Cache-Control $site_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ /\. { return 404; }
    location = / { try_files /index.html =404; }
    location ~ ^/(fregat|singapore|ghostty-webgpu)$ { return 308 /$1/; }
    location ~ ^/(fregat|singapore|ghostty-webgpu)/ { try_files $uri $uri/ @immutable; }
    location @immutable { root /srv/sites/immutable; try_files $uri =404; }
    location / { return 404; }
}
