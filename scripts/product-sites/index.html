<!doctype html>
<html lang="en">
  <head>

    <title>Shaul's projects</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;

        color: #eef1f5;
      }
      body {
        max-width: 48rem;
        margin: 10vh auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 3rem);
      }
      p {
        color: #b8c1cd;
        line-height: 1.6;
      }
      ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 1rem;

      a {
        display: block;
        padding: 1.5rem;
        border-radius: 1rem;

        text-decoration: none;

      a:hover,
      a:focus-visible {

      a p {

        <li>

        </li>
        <li>
          <a href="https://singapore.shaulavo.dev/"
            ><strong>Singapore</strong>
            <p>A code editor. Try the current examples.</p></a
