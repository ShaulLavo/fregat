services:
  sites:
    image: nginx:1.28.2-alpine
    container_name: product-sites
    restart: unless-stopped
    user: '101:101'
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
      - /tmp
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/product-sites:/srv/sites:ro
    networks: [coolify]
    labels:
      traefik.enable: 'true'
      traefik.http.routers.product-sites.rule: Host(`shaulavo.dev`)
      traefik.http.routers.product-sites.entrypoints: https
      traefik.http.routers.product-sites.tls.certresolver: letsencrypt
      traefik.http.services.product-sites.loadbalancer.server.port: '8080'
networks:
  coolify:
    external: true
